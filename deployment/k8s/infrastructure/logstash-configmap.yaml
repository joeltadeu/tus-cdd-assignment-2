apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline-config
  namespace: pms
data:
  logstash.conf: |
    input {
      tcp {
        port => 5000
        codec => json
      }
    }
      
    output {
      elasticsearch {
        hosts => ["http://elasticsearch-master:9200"]
        index => "pms-logs-%{+YYYY.MM.dd}"
      }
      
      stdout {
        codec => rubydebug
      }
    }