#global config
global:
  scrape_interval: 15s
  evaluation_interval: 5s
  scrape_timeout: 15s
  #query_log_file: <string>
  external_labels:
    monitor: 'codelab-monitor'
# Scrape configs only contain one scrape target
scrape_configs:
  - job_name: 'appointment-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'ms-appointment-service:9083' ]
        labels:
          service: 'appointment-service'

  - job_name: 'doctor-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'ms-doctor-service:9082' ]
        labels:
          service: 'doctor-service'

  - job_name: 'patient-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: [ 'ms-patient-service:9081' ]
        labels:
          service: 'patient-service'

