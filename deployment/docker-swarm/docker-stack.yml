version: '3.8'

configs:
  init-db-script:
    file: ./init.sql

services:
  mariadb:
    image: mariadb:12.0
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_ROOT_HOST: '%'
      MARIADB_INNODB_BUFFER_POOL_SIZE: 128M
      MARIADB_INNODB_LOG_FILE_SIZE: 32M
      MARIADB_INNODB_FLUSH_LOG_AT_TRX_COMMIT: 2
      MARIADB_INNODB_FLUSH_METHOD: O_DIRECT
      MARIADB_MAX_CONNECTIONS: 50
      MARIADB_QUERY_CACHE_SIZE: 0
      MARIADB_QUERY_CACHE_TYPE: 0
    configs:
      - source: init-db-script
        target: /docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 3s
        max_attempts: 3
      resources:
        limits:
          memory: 400M
          cpus: '0.4'
        reservations:
          memory: 300M
          cpus: '0.2'
    networks:
      - microservices-network

  ms-patient-service:
    image: joeltadeu/ms-patient:latest
    ports:
      - "9081:9081"
    environment:
      - SPRING_PROFILES_ACTIVE=swarm
      - JAVA_OPTS=-Xms96m -Xmx192m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XX:+TieredCompilation -XX:TieredStopAtLevel=1
    depends_on:
      - mariadb
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 192M
          cpus: '0.15'
    networks:
      - microservices-network

  ms-doctor-service:
    image: joeltadeu/ms-doctor:latest
    ports:
      - "9082:9082"
    environment:
      - SPRING_PROFILES_ACTIVE=swarm
      - JAVA_OPTS=-Xms96m -Xmx192m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XX:+TieredCompilation -XX:TieredStopAtLevel=1
    depends_on:
      - mariadb
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 192M
          cpus: '0.15'
    networks:
      - microservices-network

  ms-appointment-service:
    image: joeltadeu/ms-appointment:latest
    ports:
      - "9083:9083"
    environment:
      - SPRING_PROFILES_ACTIVE=swarm
      - JAVA_OPTS=-Xms96m -Xmx192m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+UseStringDeduplication -XX:+TieredCompilation -XX:TieredStopAtLevel=1
    depends_on:
      - mariadb
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 192M
          cpus: '0.15'
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: overlay

volumes:
  mariadb-data:
    driver: local