input {
  # Listens for logs over TCP on port 5000
  tcp {
    port => 5000
    # Assumes your microservices are sending logs in JSON format.
    # This is a best practice for structured logging.
    codec => json
  }
}

filter {
  # You can add filters here to parse or enrich your logs.
  # For example, if you need to parse a timestamp or add a static field.
  # mutate {
  #   add_field => { "environment" => "docker" }
  # }
}

output {
  # Sends the processed logs to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    # Creates a new index each day for better management
    index => "pms-logs-%{+YYYY.MM.dd}"
  }

  # Optional: Also print logs to the console for debugging
  stdout {
    codec => rubydebug
  }
}